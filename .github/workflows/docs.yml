name: Deploy documentation

# Rebuilds and publishes the MkDocs site to GitHub Pages whenever the
# documentation changes on master. See docs/maintaining.md.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs_tools/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs_tools/requirements-docs.txt
      - run: mkdocs gh-deploy --force
